name: CI

# Runs on every push to main and every pull request (including Dependabot's).
# The host pulls main on restart, so a green check here means the code is
# safe to restart onto.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"  # same as bot-hosting.net
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (errors and undefined names only)
        run: ruff check --select E9,F --output-format=github .

      - name: Compile every file
        run: python -m compileall -q .

      - name: Smoke test
        run: python tests/smoke_test.py
